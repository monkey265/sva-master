name: Build & Create Release

on:
  push:
    branches:
      - release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make scripts executable
        run: |
          chmod +x ./gradlew

      - name: Run Quality Gate Verification
        run: |
          ./gradlew test
          ./gradlew lintDebug

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Prepare Release Artifacts & Version Tag
        id: prep
        run: |
          # Extract version from app/build.gradle.kts
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="1.0.0"
          fi

          BASE_TAG="v$VERSION"
          TAG="$BASE_TAG"

          # Check if tag already exists in remote or local
          if git rev-parse "$TAG" >/dev/null 2>&1 || git ls-remote --tags origin "$TAG" | grep -q "refs/tags/$TAG$"; then
            TAG="v${VERSION}-build${{ github.run_number }}"
            echo "Tag $BASE_TAG already exists. Using unique build tag: $TAG"
          else
            echo "Using release tag: $TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Stage APKs for release upload
          mkdir -p release-apks
          find . -name "*.apk" -not -path "*/intermediates/*" | while read -r apk; do
            APK_NAME=$(basename "$apk")
            DIST_NAME="sva-master-${TAG}.apk"
            cp "$apk" "release-apks/$DIST_NAME"
            cp "$apk" "release-apks/$APK_NAME"
            echo "Staged APK: release-apks/$DIST_NAME"
          done

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prep.outputs.tag }}
          VERSION: ${{ steps.prep.outputs.version }}
        run: |
          echo "Publishing GitHub Release $TAG..."
          
          APK_FILES=$(find release-apks -name "*.apk" | tr '\n' ' ')
          
          gh release create "$TAG" $APK_FILES \
            --title "SVA Master $TAG" \
            --generate-notes \
            --target "$GITHUB_SHA"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks-${{ steps.prep.outputs.tag }}
          path: release-apks/*.apk
